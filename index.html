function desenfocar(a,w,h,radio){
  const b=new Float32Array(a.length), r=Math.max(1,Math.round(radio));
  for(let k=0;k<3;k++){
    for(let y=0;y<h;y++){ const f=y*w; let s=0;
      for(let x=-r;x<=r;x++) s+=a[f+Math.min(w-1,Math.max(0,x))];
      for(let x=0;x<w;x++){ b[f+x]=s/(2*r+1);
        s+=a[f+Math.min(w-1,Math.max(0,x+r+1))]-a[f+Math.min(w-1,Math.max(0,x-r))]; } }
    for(let x=0;x<w;x++){ let s=0;
      for(let y=-r;y<=r;y++) s+=b[Math.min(h-1,Math.max(0,y))*w+x];
      for(let y=0;y<h;y++){ a[y*w+x]=s/(2*r+1);
        s+=b[Math.min(h-1,Math.max(0,y+r+1))*w+x]-b[Math.min(h-1,Math.max(0,y-r))*w+x]; } }
  } return a;
}
function filtroLinea(d,w,h){
  const n=w*h, gris=new Float32Array(n), inv=new Float32Array(n);
  for(let i=0;i<n;i++){const p=i*4,g=.299*d[p]+.587*d[p+1]+.114*d[p+2];gris[i]=g;inv[i]=255-g;}
  const bo=desenfocar(inv,w,h,Math.max(2,w/160));
  for(let i=0;i<n;i++){const den=255-bo[i];let v=den<=1?255:(gris[i]*255)/den;if(v>255)v=255;
    v=255/(1+Math.exp(-(v-205)/12));const p=i*4;d[p]=d[p+1]=d[p+2]=v;}
}
function filtroByn(d,w,h){
  const cx=w/2,cy=h/2,m=Math.hypot(cx,cy);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(y*w+x)*4;
    let g=.299*d[p]+.587*d[p+1]+.114*d[p+2]; g=(g-128)*1.3+132;
    const dd=Math.hypot(x-cx,y-cy)/m; g*=1-.45*Math.pow(Math.max(0,dd-.4)/.6,2);
    const v=g<0?0:g>255?255:g; d[p]=d[p+1]=d[p+2]=v;}
}
function hexARgb(hex){const h=hex.replace('#','');const v=h.length===3?h.split('').map(c=>c+c).join(''):h;
  return [parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];}
function filtroDuotono(d,w,h,s){
  for(let i=0;i<w*h;i++){const p=i*4;
    let g=(.299*d[p]+.587*d[p+1]+.114*d[p+2])/255; g=Math.min(1,Math.max(0,(g-.5)*1.25+.52));
    d[p]=s[0]+(255-s[0])*g; d[p+1]=s[1]+(255-s[1])*g; d[p+2]=s[2]+(255-s[2])*g;}
}
function aplicarFiltro(ctx,w,h,f,color){
  if(f==='ninguno'||w<=0||h<=0) return;
  const img=ctx.getImageData(0,0,w,h);
  if(f==='linea') filtroLinea(img.data,w,h);
  else if(f==='byn') filtroByn(img.data,w,h);
  else filtroDuotono(img.data,w,h,hexARgb(color));
  ctx.putImageData(img,0,0);
}
function dibujarRecorte(ctx,src,sw,sh,w,h,espejo){
  const e=Math.max(w/sw,h/sh),dw=sw*e,dh=sh*e;
  ctx.save(); if(espejo){ctx.translate(w,0);ctx.scale(-1,1);}
  ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh); ctx.restore();
}

  const F=[['ninguno','Original'],['duotono','Azul'],['byn','B/N'],['linea','Línea']];
  return '<div style="'+pos([140,1620,800,70])+'display:flex;gap:14px;justify-content:center">'+
    F.map(function(f){ return '<button onclick="ponerFiltro(\''+f[0]+'\')" style="padding:12px 26px;'+
      'border-radius:999px;border:3px solid #fff;background:'+(filtro===f[0]?'#fff':'transparent')+';'+
      'color:'+(filtro===f[0]?azul():'#fff')+';font-size:26px;font-weight:700;cursor:pointer">'+f[1]+'</button>';
    }).join('')+'</div>';
}
function ponerFiltro(id){ filtro=id; if(originales.length) reprocesar(); pintar(); }

/* ============================================================
   Cámara
   ============================================================ */
function cerrarCamara(){
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  cancelAnimationFrame(anim); camaraLista=false; grabando=false;
}
async function activarCamara(){
  if(camaraLista||grabando) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:1280},facingMode:'user'},audio:false});
    camaraLista=true; pintar();
    const v=$('video'); v.srcObject=stream; await v.play();
    secuencia();
  }catch(e){ cerrarCamara(); ver('error'); }
}
function bucle(){
  const v=$('video'), l=$('lienzo');
  if(!v||!l) return;
  const ctx=l.getContext('2d',{willReadFrequently:true});
  let ultimo=0;
  const p=function(t){ anim=requestAnimationFrame(p);
    if(t-ultimo<55) return; ultimo=t; if(!v.videoWidth) return;
    dibujarRecorte(ctx,v,v.videoWidth,v.videoHeight,l.width,l.height,true);
    aplicarFiltro(ctx,l.width,l.height,filtro,azul()); };
  anim=requestAnimationFrame(p);
}
function capturarDe(src,sw,sh,espejo,f){
  const lado=1000,c=document.createElement('canvas'); c.width=c.height=lado;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  dibujarRecorte(ctx,src,sw,sh,lado,lado,espejo);
  aplicarFiltro(ctx,lado,lado,f,azul());
  return c.toDataURL('image/jpeg',.92);
}
async function secuencia(){
  grabando=true;
  const v=$('video'), seg=SEGUNDOS, N=total();
  fotos=Array(N).fill(null); originales=[];
  await esperar(600);
  for(let i=0;i<N;i++){
    for(let s=seg;s>0;s--){
      if(cancelar){grabando=false;return;}
      const c=$('cuenta'); if(c){c.style.display='flex';c.textContent=s;}
      await esperar(1000);
    }
    const c=$('cuenta'); if(c) c.style.display='none';
    const fl=$('flash'); if(fl) fl.style.opacity=1;
    await esperar(120);
    const bruto=document.createElement('canvas');
    bruto.width=v.videoWidth; bruto.height=v.videoHeight;
    bruto.getContext('2d').drawImage(v,0,0); bruto.espejo=true;
    originales[i]=bruto;
    fotos[i]=capturarDe(v,v.videoWidth,v.videoHeight,true,filtro);
    if(fl) fl.style.opacity=0;
    const cont=$('contador'); if(cont) cont.textContent='Foto '+Math.min(i+2,N)+' de '+N;
    await esperar(650);
  }
  grabando=false; cerrarCamara(); ver('carga');
}
function reprocesar(){
  fotos=originales.map(function(c){ return c?capturarDe(c,c.width,c.height,!!c.espejo,filtro):null; });
  if(pantalla==='resultado') componerTira();
}

/* ============================================================
   Tira y pantalla de carga
   ============================================================ */
async function componerTira(){
  const lista=fotos.filter(Boolean), N=lista.length;
  if(!N) return;
  const e=2, ancho=TIRA.ancho*e, margen=TIRA.margenLateral*e, arriba=TIRA.margenSuperior*e,
        hueco=TIRA.hueco*e, lado=ancho-margen*2, alto=altoTira(N)*e;
  const c=document.createElement('canvas'); c.width=ancho; c.height=alto;
  const ctx=c.getContext('2d');
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tira').trim();
  ctx.fillRect(0,0,ancho,alto);
  const imgs=await Promise.all(lista.map(function(s){return cargarImagen(s);}));
  imgs.forEach(function(img,i){ ctx.drawImage(img,margen,arriba+i*(lado+hueco),lado,lado); });
  const d=TIRA.logo*e, p=[];
  [ancho*0.161,ancho*0.472,ancho*0.781].forEach(function(x){ p.push([x,arriba*0.42]); p.push([x,alto-arriba*0.42]); });
  const y0=arriba*0.85, y1=alto-arriba*0.85, paso=(y1-y0)/(TIRA.logosLaterales-1);
  for(let i=0;i<TIRA.logosLaterales;i++){
    p.push([margen*0.47,y0+i*paso]); p.push([ancho-margen*0.47,y0+i*paso+paso*0.18]);
  }
  try{
    const logo=await cargarImagen(LOGO_MARCO);
    const h=(logo.height/logo.width)*d;
    p.forEach(function(q){ ctx.drawImage(logo,q[0]-d/2,q[1]-h/2,d,h); });
  }catch(e){}
  tiraUrl=c.toDataURL('image/png');
}
async function arrancarCarga(){
  const inicio=Date.now(); tiraUrl='';
  const reloj=setInterval(function(){
    const p=Math.min(100,(Date.now()-inicio)/2400*100);
    const a=$('arco'); if(a) a.setAttribute('stroke-dasharray',(p/100*289)+' 289');
    if(p>=100) clearInterval(reloj);
  },60);
  await componerTira();
  const falta=2400-(Date.now()-inicio);
  if(falta>0) await esperar(falta);
  clearInterval(reloj);
  if(pantalla==='carga') ver('resultado');
}
function descargar(){
  if(!tiraUrl) return;
  const a=document.createElement('a'); a.href=tiraUrl; a.download='onstar-photobooth.png'; a.click();
}
function reiniciar(){ fotos=Array(total()).fill(null); originales=[]; tiraUrl=''; ver('portada'); }

/* ============================================================
   Subir fotos
   ============================================================ */
const entrada=document.createElement('input');
entrada.type='file'; entrada.accept='image/*';
entrada.onchange=async function(ev){
  const f=ev.target.files[0]; if(!f) return;
  const img=await cargarImagen(URL.createObjectURL(f));
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  c.getContext('2d').drawImage(img,0,0);
  originales[slot]=c;
  fotos[slot]=capturarDe(img,img.width,img.height,false,filtro);
  entrada.value=''; pintar();
};
function elegir(i){ slot=i; entrada.click(); }

/* ============================================================
   Tamaño de la pieza
   ------------------------------------------------------------
   En móvil ocupa la pantalla entera.
   En computador o tablet apaisada se ve como un móvil: alto
   completo, proporción 9:16 y el azul de marca alrededor.
   ============================================================ */
function encajar(){
  const caja=$('caja'), an=innerWidth, al=innerHeight, ancha=an/al>=0.8;
  let mesaFondo=document.getElementById('mesaFondo');
  if(ancha && FONDO_ESCRITORIO){                     // computador con mesa horizontal
    if(!mesaFondo){
      mesaFondo=document.createElement('img'); mesaFondo.id='mesaFondo';
      mesaFondo.style.cssText='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none';
      document.querySelector('main').prepend(mesaFondo);
    }
    mesaFondo.src=FONDO_ESCRITORIO;
    const z=ZONA_ESCRITORIO, escalaMesa=Math.max(an/1920, al/1080);
    caja.style.width=Math.round(z[2]*escalaMesa)+'px';
    caja.style.height=Math.round(z[3]*escalaMesa)+'px';
    caja.style.position='absolute';
    caja.style.left=Math.round(an/2+(z[0]+z[2]/2-960)*escalaMesa-z[2]*escalaMesa/2)+'px';
    caja.style.top=Math.round(al/2+(z[1]+z[3]/2-540)*escalaMesa-z[3]*escalaMesa/2)+'px';
    ajuste='contener';
  }else{
    if(mesaFondo) mesaFondo.remove();
    caja.style.position='relative'; caja.style.left=''; caja.style.top='';
    if(!ancha){                                      // móvil o tablet vertical
      caja.style.width=an+'px'; caja.style.height=al+'px'; ajuste='auto';
    }else if(FONDOS_H[iFondo] && Z_H[iFondo]){       // computador con mesa horizontal
      caja.style.width=an+'px'; caja.style.height=al+'px'; ajuste='cubrir';
    }else{                                           // computador sin mesa horizontal
      caja.style.height=al+'px';
      caja.style.width=Math.round(al*MESA.ancho/MESA.alto)+'px'; ajuste='contener';
    }
  }
  escalar();
}
addEventListener('resize', encajar);

function fotosDePrueba(){
  const N=total(); originales=[]; fotos=[];
  for(let i=0;i<N;i++){
    const c=document.createElement('canvas'); c.width=c.height=1000;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(500,420,60,500,600,760);
    g.addColorStop(0,'#f6efe6'); g.addColorStop(1,'#54606e');
    x.fillStyle=g; x.fillRect(0,0,1000,1000);
    x.fillStyle=['#e0b78f','#d4a97f','#eccfae','#dbb495','#e8c39e','#cfa079'][i%6];
    x.beginPath(); x.ellipse(500,430,190,240,0,0,7); x.fill();
    x.fillStyle='#2b2b2b';
    x.beginPath(); x.ellipse(440,390,24,15,0,0,7); x.fill();
    x.beginPath(); x.ellipse(560,390,24,15,0,0,7); x.fill();
    x.lineWidth=10; x.strokeStyle='#6b3030';
    x.beginPath(); x.arc(500,500,75,.25,Math.PI-.25); x.stroke();
    x.fillStyle='#33415c'; x.beginPath(); x.ellipse(500,980,350,240,0,0,7); x.fill();
    originales.push(c); fotos.push(capturarDe(c,1000,1000,false,filtro));
  }
  ver('carga');
}

/* atajo para probar la tira sin cámara: tecla D */
addEventListener('keydown', function(e){ if(e.key==='d'||e.key==='D') fotosDePrueba(); });

encajar();
ver('portada');
</script>
